<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Variant Curation</title>
  <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
  <main>
    <h1>Variant Curation</h1>
    <p class="muted">Enter a variant to pull its dbSNP, ClinVar, gnomAD and UCSC GERP information, with links to Varsome and Franklin.</p>

    <form id="form" class="card" autocomplete="off">
      <label>rsID
        <input id="rsid" placeholder="rs775194825" required>
      </label>
      <label>Reference
        <input id="ref" placeholder="C">
      </label>
      <label>Nucleotide
        <input id="nuc" placeholder="A, delC or insGA" required>
      </label>
      <button id="go" type="submit">Look up</button>
      <label class="auto"><input type="checkbox" id="auto" checked> Open Varsome and Franklin in side windows when I look up a variant</label>
      <p id="popup-note" class="note auto-note" hidden>Your browser blocked a window. Click the blocked pop-up icon in the address bar and choose "Always allow" for this site, then look up again.</p>
    </form>

    <div id="result"></div>
  </main>
  <script src="js/dbsnp.js?v=13"></script>
  <script src="js/clinvar.js?v=13"></script>
  <script src="js/gnomad.js?v=13"></script>
  <script src="js/ucsc.js?v=13"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
