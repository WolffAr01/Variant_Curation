<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Variant Curation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Variant Curation</h1>
    <p class="muted">Enter a variant to pull its dbSNP, ClinVar and gnomAD information. More sources will be added step by step.</p>

    <form id="form" class="card" autocomplete="off">
      <label>rsID
        <input id="rsid" placeholder="rs775194825" required>
      </label>
      <label>Reference
        <input id="ref" placeholder="C">
      </label>
      <label>Nucleotide
        <input id="nuc" placeholder="A, delC or insGA" required>
      </label>
      <button id="go" type="submit">Look up</button>
    </form>

    <div id="result"></div>
  </main>
  <script src="js/dbsnp.js"></script>
  <script src="js/clinvar.js"></script>
  <script src="js/gnomad.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
